<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<!-- 设计稿（1568px 宽的 392pt 手机稿）按 2x 落 CSS：页面逻辑宽度 784，手机上由系统按比例缩放显示 -->
<meta name="viewport" content="width=784,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="favicon.png">
<style>
/* ========== 主题变量：亮色 / 深色（跟随手机系统） ========== */
:root {
  --bg: #ffffff;
  --title: #333333;        /* 页面大标题 */
  --heading: #000000;      /* 主标题 / 小节标题 / 常见问题 */
  --sub: #4d4d4d;          /* 说明文字 / 步骤标题 / FAQ 问句 */
  --body: rgba(0, 0, 0, 0.5);  /* 列表与答案正文 */
  --caption: #999999;      /* 图注 */
  --img-bg: #f7f7f7;       /* 图片卡片底色 */
  --divider: #e6e6e6;
  --link: #00B884;
  /* 设计像素 → 视口像素：视口≥784 时恒为 1px（与设计稿 1:1），
     更窄时整体等比缩小（内嵌 WebView 不认 viewport meta 的兜底）。 */
  --s: 1px;
  --s: min(1px, calc(100vw / 784));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;                       /* 跟米家 App 暗色背景一致：纯黑 */
    --title: #ffffff;
    --heading: #ffffff;
    --sub: #b3b3b3;
    --body: rgba(255, 255, 255, 0.6);
    --caption: #8c8c8c;
    --img-bg: #141414;                   /* 卡片：在纯黑上略微抬起一档 */
    --divider: rgba(255, 255, 255, 0.15);
    --link: #00B884;
  }
}

/* ========== 基础样式（设计稿 2x：全部尺寸 = calc(1568 * var(--s)) 设计稿 ÷ 2） ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
/* 页面只允许纵向滚动：横向手势一律不交给浏览器。
   早期写的是 pan-x pan-y，它仍然放行横向平移——WebView 里视觉视口比布局视口宽出
   几 px 时就能左右挪动一点，而 overflow-x 管不到这种"视觉视口平移"。
   配合 viewport 里的 user-scalable=no 一起挡住缩放引起的视口漂移。
   （touch-action 在祖先链取交集，所以必须写在 html 上。） */
/* 显式给 html 也上背景：body 的背景虽然会传递到画布，但内嵌 WebView 的
   回弹区/安全区偶尔会露出一层，写死更稳。 */
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; touch-action: pan-y; background: var(--bg); }
body {
  background: var(--bg);
  color: var(--title);
  /* 兜底：万一将来有元素比视口宽（--s 按 100vw 算，而 vw 含滚动条宽度），
     这里把横向溢出裁掉，避免出现横向滚动条。只会吃掉右侧留白。 */
  overflow-x: hidden;
  /* 只用系统字体，不下载任何字体文件：
     小米/HyperOS 设备自带 MiSans，命中第一项即与设计稿一致；
     其它设备依次落到苹方（iOS）、HarmonyOS Sans（华为）、微软雅黑（Windows）、
     系统默认无衬线（Android 等）。中日韩字体每字都是 1em 宽，
     所以换字体不影响断行、居中、卡片尺寸，只影响字形长相。 */
  font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.4;
}
.page {
  max-width: calc(784 * var(--s));
  margin: 0 auto;
  padding: calc(52 * var(--s)) calc(52 * var(--s)) calc(116 * var(--s));
}

/* 标题 */
.page-title   { font-size: calc(64 * var(--s)); font-weight: 400; line-height: calc(84.8 * var(--s)); margin-bottom: calc(108 * var(--s)); }   /* 设计稿 32/42.4 */
.main-title   { font-size: calc(40 * var(--s)); font-weight: 500; line-height: calc(53 * var(--s)); margin-bottom: calc(44 * var(--s)); color: var(--heading); margin-right: calc(-80 * var(--s)); }   /* 设计稿 20/26.5，文本框宽 380（比内容列 340 宽 40）→ 页面放宽到 760 保证一行 */
.main-title.break { margin-top: calc(176 * var(--s)); }   /* 智能玩法页里的跨板块大间隔 */
.section-title{ font-size: calc(40 * var(--s)); font-weight: 500; line-height: calc(53 * var(--s)); margin: 0 0 calc(48 * var(--s)); color: var(--heading); }   /* 设计稿 20/26.5 */
/* 智能玩法页：设备要求之后直接接小节标题，需要设计稿里那段大间距 */
.requirement + .section-title { margin-top: calc(160 * var(--s)); }

/* 说明文字 / 清单 */
.body-text    { font-size: calc(28 * var(--s)); line-height: calc(37.2 * var(--s)); color: var(--sub); margin-bottom: calc(24 * var(--s)); }
.requirement  { font-size: calc(28 * var(--s)); line-height: calc(37.2 * var(--s)); color: var(--sub); }
.model-list   { list-style: none; }
.model-list li {
  position: relative;
  padding-left: calc(38 * var(--s));
  font-size: calc(24 * var(--s));
  line-height: calc(40 * var(--s));
  color: var(--body);
}
.model-list li::before { content: "•"; position: absolute; left: calc(14 * var(--s)); color: var(--body); }

/* 功能区 / 步骤区 */
.feature      { margin-top: 0; }
.feature + .feature .feature-title { margin-top: calc(64 * var(--s)); }
.feature-title{ font-size: calc(28 * var(--s)); line-height: calc(37.2 * var(--s)); color: var(--sub); }
.step         { margin-bottom: 0; }
.step-title   { font-size: calc(28 * var(--s)); line-height: calc(37.2 * var(--s)); color: var(--sub); margin: calc(80 * var(--s)) 0 calc(30 * var(--s)); }   /* 设计稿 14/18.6 */
.step-title.is-final,
.feature-title.is-link { font-size: calc(30 * var(--s)); line-height: calc(40 * var(--s)); }   /* 设计稿：收尾/跳转那一行大一号 15/19.9 */
/* 步骤标题紧跟小节标题时（file_manager / smart_play 的管理文件小节）不留上间距 */
.section-title + .step .step-title,
.section-title + .step-title { margin-top: 0; }
.step-title .num { display: inline-block; width: calc(40 * var(--s)); }
.step-text    { font-size: calc(24 * var(--s)); line-height: calc(40 * var(--s)); color: var(--body); }

/* 图片卡片：灰框只包图片，图注放在灰框下方 —— 这样任何长度的图注都不会压到图上 */
figure {
  margin: calc(36 * var(--s)) 0 calc(50 * var(--s));
}
figure img {
  display: block;
  width: 100%;
  height: auto;
  margin: calc(-16 * var(--s)) 0;
}
/* 图片外层容器：就是那个灰色圆角卡片，负责灰底 / 圆角 / 上下裁切。
   图片不可点击，所以这里不是 <a>，也没有任何点击行为。 */
figure > .shot {
  display: block;
  -webkit-tap-highlight-color: transparent;
  border-radius: calc(24 * var(--s));
  background: var(--img-bg);
  overflow: hidden;
}
figcaption {
  margin-top: calc(16 * var(--s));
  padding: 0 calc(20 * var(--s));
  font-size: calc(20 * var(--s));   /* 设计稿 10/14（1x）→ 页面 20/28 */
  line-height: calc(28 * var(--s));
  color: var(--caption);
  text-align: center;
}

/* 分割线 */
.divider { border: none; height: calc(1 * var(--s)); background: var(--divider); margin: calc(92 * var(--s)) 0; }

/* 常见问题 */
.faq-title { font-size: calc(40 * var(--s)); font-weight: 500; line-height: calc(53 * var(--s)); margin-bottom: calc(48 * var(--s)); color: var(--heading); }
.faq-item  { margin-top: calc(48 * var(--s)); }
.faq-q     { font-size: calc(28 * var(--s)); line-height: calc(38 * var(--s)); color: var(--sub); margin-bottom: calc(22 * var(--s)); }
.a-item    { display: flex; font-size: calc(24 * var(--s)); line-height: calc(44 * var(--s)); color: var(--body); }
.a-item .mark { flex: none; margin-right: calc(14 * var(--s)); width: calc(24 * var(--s)); }
.a-text    { flex: 1; min-width: 0; }
/* 层级：bullet=•, check=∘, sub=次级•, letter=a./b./c., roman=i./ii., note=无标记说明行 */
.lvl-bullet, .lvl-check { padding-left: calc(14 * var(--s)); }
.lvl-sub, .lvl-letter, .lvl-note { padding-left: calc(32 * var(--s)); }
.lvl-roman  { padding-left: calc(56 * var(--s)); }
.lvl-note   { margin-top: calc(16 * var(--s)); }

/* 链接（页内锚点 / 页面互跳 / 外链）与高亮文字 */
a { color: var(--link); text-decoration: none; }
a:active { opacity: 0.6; }
.hl { color: var(--link); }

/* 指南目录页（index.html） */
.index-title { font-size: calc(52 * var(--s)); line-height: calc(69 * var(--s)); }   /* 与大标题同比例（52 × 1.325） */
.index-intro { margin: calc(-12 * var(--s)) 0 calc(72 * var(--s)); font-size: calc(28 * var(--s)); line-height: calc(42 * var(--s)); color: var(--sub); }
.index-section { margin-bottom: calc(76 * var(--s)); }
.index-section .section-title { margin: 0 0 calc(28 * var(--s)); }
.index-list { margin: 0; padding: 0; }
.index-list li { list-style: none; margin-bottom: calc(20 * var(--s)); }
.index-list li:last-child { margin-bottom: 0; }
.index-card { display: block; padding: calc(30 * var(--s)) calc(32 * var(--s)); background: var(--img-bg); border-radius: calc(24 * var(--s)); }
.index-card-title { display: block; font-size: calc(30 * var(--s)); line-height: calc(42 * var(--s)); color: var(--link); }
.index-card-desc { display: block; margin-top: calc(4 * var(--s)); font-size: calc(24 * var(--s)); line-height: calc(36 * var(--s)); color: var(--caption); }

</style>
</head>
<body>
<main class="page">
{{BODY}}
</main>
</body>
</html>
